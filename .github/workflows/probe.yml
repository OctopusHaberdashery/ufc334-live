name: Probe ESPN fighter feeds
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests==2.32.3 && python scraper/probe.py
      - run: |
          git config user.name "ufc-tracker-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events/_probe && git commit -m "Probe samples" && git pull --rebase origin main && git push origin main
